<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%279%27 fill=%27%2317302a%27/%3E%3Cpath d=%27M8 33V15h4v-4h3v4h3v-4h4v4h3v-4h3v4h4v18h-8v-7a3 3 0 0 0-6 0v7Z%27 fill=%27%23c8b48f%27/%3E%3C/svg%3E">
<style>[hidden] { display: none !important; }</style>
<title>لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../admin/admin.css">

</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <header class="bar">
    <div class="bar-in">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 36V14h5v-5h4v5h4v-5h2v5h4v-5h4v5h5v22H24V26a4 4 0 0 0-8 0v10Z" /></svg>
        <div>
          <h1>لوحة التحكم</h1>
          <p class="save-state" id="saveState" role="status">بنوصل للسيرفر…</p>
        </div>
      </div>
      <div class="bar-actions" id="barActions" hidden>
        <button class="btn btn-quiet" id="btnLock" type="button" hidden>خروج</button>
        <button class="btn btn-quiet" id="btnSave" type="button">احفظ<span class="dot" id="saveDot" hidden></span></button>
        <button class="btn btn-accent" id="btnPublish" type="button">انشر على الموقع</button>
      </div>
    </div>
    <div class="pub-line" id="pubLine" hidden>
      <span class="pub-state" id="pubState">ما انتشر لسا</span>
      <a class="link" id="menuLink" href="/" target="_blank" rel="noopener">افتح الموقع ↗</a>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="أقسام اللوحة" hidden>
    <div class="tabs-in" role="tablist">
      <button role="tab" type="button" data-tab="cafe" aria-selected="true">الاسم والشعار</button>
      <button role="tab" type="button" data-tab="items" aria-selected="false">الأصناف</button>
      <button role="tab" type="button" data-tab="cats" aria-selected="false">الأقسام</button>
      <button role="tab" type="button" data-tab="hero" aria-selected="false">الواجهة</button>
      <button role="tab" type="button" data-tab="texts" aria-selected="false">النصوص</button>
      <button role="tab" type="button" data-tab="colors" aria-selected="false">الألوان</button>
      <button role="tab" type="button" data-tab="visit" aria-selected="false">الدوام والتواصل</button>
      <button role="tab" type="button" data-tab="security" aria-selected="false">الأمان</button>
    </div>
  </nav>

  <main class="main" id="main">
    <div class="notice">بنوصل للسيرفر…</div>
  </main>
  <p class="error-line" id="errorLine" role="alert" hidden></p>
  <div class="undo" id="undoBar" role="status" hidden><span id="undoText"></span><button type="button" id="undoBtn">تراجع</button></div>
</div>

<script src="../js/menu-data.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/icons.js"></script>
<script src="admin.js"></script>
</body>
</html>
